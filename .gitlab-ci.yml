# Jorbique VPN on a Linux runner (Docker executor, x86_64): the frontend, the Go
# tests, the Windows zip and the macOS .pkg. The .pkg is cross-built: Go builds
# both macOS slices, llvm-lipo fuses them, rcodesign signs the binary ad hoc, and
# xar + mkbom pack the installer (scripts/pkg/build-flat-pkg.sh). The version
# comes from the VERSION file.
stages:
  - test
  - build

variables:
  GO_VERSION: "1.25"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  GOMODCACHE: "${CI_PROJECT_DIR}/.go/pkg/mod"
  GOCACHE: "${CI_PROJECT_DIR}/.go/cache"

.go-cache:
  cache:
    key:
      files: [go.mod, go.sum]
      prefix: go-${GO_VERSION}
    paths:
      - .go/pkg/mod
      - .go/cache
      - .go/bin

frontend:
  stage: test
  image: node:22-bookworm
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test
    - npm run build
  artifacts:
    expire_in: 1 day
    paths: [frontend/dist/]

test:
  stage: test
  image: golang:${GO_VERSION}-bookworm
  extends: .go-cache
  needs: [frontend]
  script:
    - apt-get update && apt-get install -y --no-install-recommends make && rm -rf /var/lib/apt/lists/*
    - make vet test-unit
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit-report.xml

build:windows:
  stage: build
  image: golang:${GO_VERSION}-bookworm
  extends: .go-cache
  needs: [frontend]
  script:
    # node stamps the version into the exe's resources (scripts/bump-windows-version.mjs).
    - apt-get update && apt-get install -y --no-install-recommends zip nodejs && rm -rf /var/lib/apt/lists/*
    - SKIP_FRONTEND=1 bash scripts/build-windows.sh
  artifacts:
    expire_in: 4 weeks
    paths:
      - release/binaries/Jorbique-VPN-windows.zip

build:macos:
  stage: build
  timeout: 45m
  # trixie: Debian stable before it has no xar package.
  image: golang:${GO_VERSION}-trixie
  extends: .go-cache
  needs: [frontend]
  script:
    # llvm provides llvm-lipo, which fuses the arm64 and amd64 slices into one
    # universal binary; imagemagick and icnsutils draw AppIcon.icns.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xar imagemagick icnsutils cpio g++ make git llvm && rm -rf /var/lib/apt/lists/*
    - |
      set -euo pipefail
      # mkbom writes the installer's bill of materials; Debian does not package it.
      git clone --depth 1 https://github.com/hogliux/bomutils.git /tmp/bomutils
      make -C /tmp/bomutils PREFIX=/usr/local install
      rm -rf /tmp/bomutils
      command -v mkbom
    - |
      set -euo pipefail
      # Apple Silicon refuses to run an unsigned binary; rcodesign signs Mach-O
      # without Apple tooling. Pinned, and checked against the release's
      # .sha256: a tampered tarball could sign anything. Bump both together.
      RCODESIGN_VER="0.27.0"
      RCODESIGN_SHA256="a0e0c548b313026abf4f40a6e06554d352c6f4e1add6a87d626c94134a4ee564"
      curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VER}/apple-codesign-${RCODESIGN_VER}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/rcodesign.tar.gz
      echo "${RCODESIGN_SHA256}  /tmp/rcodesign.tar.gz" | sha256sum -c -
      tar -xzf /tmp/rcodesign.tar.gz -C /tmp
      install -m0755 "$(find /tmp -name rcodesign -type f | head -n1)" /usr/local/bin/rcodesign
      rcodesign --version
    - SKIP_FRONTEND=1 bash ./build-macos.sh package
    - |
      set -euo pipefail
      # A flat package the macOS Installer accepts: a Distribution naming this
      # package, and a component with its payload, bill of materials and scripts.
      PKG="${CI_PROJECT_DIR}/release/binaries/Jorbique-VPN-macOS.pkg"
      test -s "$PKG"
      toc="$(xar -tf "$PKG" | sed 's|^\./||')"
      for f in Distribution base.pkg/Payload base.pkg/Bom base.pkg/PackageInfo base.pkg/Scripts; do
        printf '%s\n' "$toc" | grep -qx "$f" || { echo "ERROR: .pkg is missing $f" >&2; printf '%s\n' "$toc" >&2; exit 1; }
      done
      xe="$(mktemp -d)"
      (cd "$xe" && xar -xf "$PKG" Distribution)
      grep -q 'one.jorbique.vpn.pkg' "$xe/Distribution"
      grep -q 'base.pkg' "$xe/Distribution"
      echo "pkg structure OK"
  artifacts:
    expire_in: 4 weeks
    paths:
      - release/binaries/Jorbique-VPN-macOS.pkg
